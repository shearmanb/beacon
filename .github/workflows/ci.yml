name: CI

on:
  push:
    branches: ["claude/app-rebuild-strategy-2xbedp", "main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages + worker + migrate)
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Web typecheck
        run: pnpm --filter @beacon/web exec tsc --noEmit
      - name: Web build (next build)
        run: pnpm --filter @beacon/web build
