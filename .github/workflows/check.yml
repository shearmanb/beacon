name: Beacon Check

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"   # every 5 min, offset +3 to avoid congested :00/:15/:30/:45 slots
  workflow_dispatch:          # manual "Run Now" trigger


permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node checker.js

      - name: Commit updated state
        run: |
          cp state.json /tmp/state.json
          cp alert_history.json /tmp/alert_history.json
          cp ignored_products.json /tmp/ignored_products.json
          git config user.name "beacon-bot"
          git config user.email "beacon-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/state.json state.json
          cp /tmp/alert_history.json alert_history.json
          cp /tmp/ignored_products.json ignored_products.json
          git add state.json alert_history.json ignored_products.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push
