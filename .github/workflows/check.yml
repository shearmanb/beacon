name: Beacon Check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:          # manual "Run Now" trigger

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node checker.js

      - name: Commit updated state
        run: |
          git config user.name "beacon-bot"
          git config user.email "beacon-bot@users.noreply.github.com"
          git add state.json alert_history.json ignored_products.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push
